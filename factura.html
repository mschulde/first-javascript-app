<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="factura.js" defer></script>
</head>



<body>


    <div class="container-xs bg-danger">
        <h1>Factura Lico Store</h1>
        
        <div class="bg-danger">
        <section>
            <label>Cliente:</label>
            <input type="text" id="nombreCliente">

            <label>Cédula:</label>
            <input type="text" id="cedulaCliente">

            <label>Sexo:</label>
            <input type="text" id="sexoCliente">

        </section>
        </div>
    </div>



    <div class="container-xs bg-secondary">
        <h3>Agregar Productos</h3>
        <div class="bg-secondary">
        <section>
            <label>Producto:</label>
            <input type="text" id="producto">

            <label>Cantidad:</label>
            <input type="number" id="cantidadProducto">

            <label>Precio:</label>
            <input type="number" id="precioProducto">

            <button id="btnAgregarProducto">Agregar Producto</button>
        </section>
        </div>
    </div>



    <div class="container-xs bg-primary">
        <h3>Lista de Productos</h3>
        <div class="bg-primary">
            <section>
                <table border="3" table table-hover>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>

                        </tr>

                    </thead>

                    <tbody id="detalleFactura">

                    </tbody>


                </table>
            </section>
        </div>
    </div>



    <div class="container-xs d-flex justify-content-end bg-warning">
        <h3>Resumen de la Factura</h3>
        
        <div class="bg-warning text-end pe-4"><br>
            <section>
                <label id="subtotal">Subtotal: 0.00</label><br>
                <label id="iva">IVA: 0.00</label><br>
                <label id="total">Total: 0.00</label>
            </section>
            
        </div>
    </div>

</body>



</html>
